<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Proof editor</title>
  <link rel="stylesheet" href="/editor.css">
</head>
<body>
  <main id="topic-setup" class="setup" hidden>
    <h1>Topics</h1>
    <p>Add topics for optional explanations. You can change them later.</p>
    <div id="setup-fields"></div>
    <p id="setup-status" role="status" aria-live="polite"></p>
    <button id="setup-continue" class="setup-continue" type="button">Continue to editor</button>
    <p class="setup-hint">Existing tagged pages need matching topic IDs.</p>
  </main>
  <main id="editor-workspace" class="workspace" hidden>
    <nav class="toolbar" aria-label="Document controls">
      <select id="pages" aria-label="Documentation page"></select>
      <button id="new-page" class="quiet" type="button">New page</button>
      <span class="toolbar-spacer"></span>
      <button id="save" class="save" type="button">Save</button>
    </nav>
    <details class="topic-settings">
      <summary>Topics</summary>
      <div id="topic-content" class="topic-content">
        <div id="topics"></div>
        <form id="add-topic">
          <label>Topic name <input id="topic-name" required></label>
          <label>Topic ID <input id="topic-id" required pattern="[a-z][a-z0-9-]*" placeholder="number-theory"></label>
          <button type="submit">Add topic</button>
        </form>
        <p>Topics in use must be removed from passages before they can be deleted.</p>
      </div>
    </details>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="panes">
      <section class="pane" id="writing-pane">
        <label class="pane-label" for="editor">Write <span>Markdown + LaTeX</span></label>
        <textarea id="editor" spellcheck="false"></textarea>
      </section>
      <div id="pane-divider" class="pane-divider" role="separator" tabindex="0" aria-label="Resize writing and preview panes" aria-controls="writing-pane" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" title="Drag to resize panes; use arrow keys to adjust"></div>
      <section class="pane">
        <div class="pane-heading">
          <span class="pane-label">Preview</span>
          <a id="open-preview" class="expand-preview" target="_blank" rel="noopener" aria-label="Open preview in a new tab" title="Open preview in a new tab" aria-disabled="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"/></svg>
          </a>
        </div>
        <iframe id="frame" title="Reader preview"></iframe>
      </section>
    </div>
  </main>
  <script src="/editor.js"></script>
  <script src="/pane-resize.js"></script>
</body>
</html>
