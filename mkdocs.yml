site_name: Proof Notes POC
site_description: A minimal proof documentation prototype with local reference cards.
site_url: ''
theme:
  name: material
  language: en
  features:
  - navigation.sections
  - navigation.expand
  - navigation.tracking
  - search.highlight
  - toc.integrate
  font: false
nav:
- Home: index.md
- "Chapter 1 \u2014 Even Numbers": chapters/01-even-numbers.md
- chapters/groups.md: chapters/groups.md
- Topological group extensions: chapters/topological-extensions.md
markdown_extensions:
- attr_list
- md_in_html
- footnotes
- toc:
    permalink: true
- markdown_katex:
    insert_fonts_css: false
    macro-file: docs/tex-macros.txt
- pymdownx.superfences
- pymdownx.details
- admonition
extra_css:
- https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css
- stylesheets/proof-notes.css
- https://tikzjax.com/v1/fonts.css
extra_javascript:
- javascripts/reference-panel.js
- javascripts/topic-switch.js
- https://tikzjax.com/v1/tikzjax.js
hooks:
- plugins/topic_checker.py
- plugins/proof_references.py
