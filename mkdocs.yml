site_name: Proof Notes POC
site_description: A minimal proof documentation prototype with local reference cards.
site_url: ''
theme:
  name: material
  language: en
  features:
  - navigation.sections
  - navigation.expand
  - navigation.instant
  - navigation.tracking
  - search.highlight
  - toc.integrate
  font: false
nav:
- Home: index.md
- "Chapter 1 \u2014 Even Numbers": chapters/01-even-numbers.md
- chapters/groups.md: chapters/groups.md
markdown_extensions:
- attr_list
- md_in_html
- footnotes
- toc:
    permalink: true
- markdown_katex:
    insert_fonts_css: true
- pymdownx.superfences
- pymdownx.details
- admonition
extra_css:
- stylesheets/proof-notes.css
extra_javascript:
- javascripts/reference-panel.js
- javascripts/topic-switch.js
hooks:
- plugins/knowledge.py
- plugins/proof_references.py
